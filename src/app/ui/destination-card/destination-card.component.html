<article>
  <img
    [src]="src()"
    [srcset]="srcset()"
    sizes="(min-width: 1024px) calc((min(100vw, 1536px) - 128px) / 3),
           (min-width: 768px) calc((100vw - 96px) / 2),
           calc(100vw - 40px)"
    [alt]="destination().alt"
    width="900"
    height="600"
    loading="lazy"
    class="aspect-video w-full rounded-lg object-cover"
  />

  <p class="mt-4 flex items-center gap-2 font-bold text-ink">
    <app-calendar-icon />
    {{ destination().label }}
  </p>

  <!-- Título y texto ocupan dos y seis alturas de línea fijas, sobre o falte contenido, así
       todas las cards de la fila terminan a la misma altura. lh se adapta solo al tamaño de
       cada breakpoint, sin necesidad de variantes. -->
  <h3 class="mt-4 line-clamp-2 min-h-[2lh] text-2xl leading-8 font-bold md:text-3xl">
    {{ destination().title }}
  </h3>

  <p class="mt-4 line-clamp-6 min-h-[6lh] text-ink">{{ destination().description }}</p>
</article>

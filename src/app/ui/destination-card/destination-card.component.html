<article>
  <img
    [src]="src()"
    [srcset]="srcset()"
    sizes="(min-width: 1024px) calc((min(100vw, 1536px) - 128px) / 3),
           (min-width: 768px) calc((100vw - 96px) / 2),
           calc(100vw - 40px)"
    [alt]="destination().alt"
    width="900"
    height="600"
    loading="lazy"
    class="aspect-video w-full rounded-lg object-cover"
  />

  <p class="mt-4 flex items-center gap-2 font-bold text-[#343a40]">
    <app-calendar-icon />
    {{ destination().label }}
  </p>

  <h3 class="mt-4 line-clamp-2 text-2xl leading-8 font-bold md:text-3xl">
    {{ destination().title }}
  </h3>

  <!-- 6lh son seis alturas de línea: el bloque ocupa siempre lo mismo aunque el texto no
       llegue, así las cards de la fila terminan a la misma altura. -->
  <p class="mt-4 line-clamp-6 min-h-[6lh] text-[#343a40]">{{ destination().description }}</p>
</article>

<article>
  <img
    [src]="destination().image"
    [alt]="destination().alt"
    width="900"
    height="600"
    loading="lazy"
    class="aspect-video w-full rounded-lg object-cover"
  />

  <p class="mt-4 flex items-center gap-2 font-bold text-[#343a40]">
    <app-calendar-icon />
    {{ destination().label }}
  </p>

  <h3 class="mt-4 line-clamp-2 text-2xl leading-7 font-bold md:text-3xl">
    {{ destination().title }}
  </h3>

  <p class="mt-4 line-clamp-6 text-[#343a40]">{{ destination().description }}</p>
</article>

<article class="group relative aspect-3/4 overflow-hidden rounded-lg">
  <img
    [src]="src()"
    [srcset]="srcset()"
    sizes="(min-width: 1280px) calc((min(100vw, 1536px) - 160px) / 4),
           (min-width: 768px) 360px,
           284px"
    [alt]="experience().alt"
    width="450"
    height="600"
    loading="lazy"
    class="absolute inset-0 h-full w-full object-cover transition-transform duration-500
           ease-out group-hover:scale-105 group-focus-within:scale-105"
  />

  <!-- Velo plano sobre toda la foto, como hace riu.com en Encuentra tu experiencia. El
       degradado solo no alcanza: el título cae en la parte floja de la rampa y sobre fotos
       claras no llega al contraste mínimo. -->
  <div class="absolute inset-0 bg-black/40"></div>

  <!-- 174px es la altura de la rampa en el Figma, la misma en los tres breakpoints. Va como
       min-height para que un título de dos líneas la estire en vez de desbordarla. -->
  <div
    class="absolute inset-x-0 bottom-0 flex min-h-[174px] flex-col justify-end bg-linear-to-t
           from-black to-transparent p-4 text-white"
  >
    <h3 class="text-3xl font-bold">{{ experience().title }}</h3>
    <p class="mt-2">{{ experience().subtitle }}</p>

    <a
      [href]="experience().brochure"
      [attr.aria-label]="'Descargar el folleto de ' + experience().title + ' en PDF'"
      download
      class="mt-8 flex w-fit items-center gap-2 font-bold underline-offset-4 hover:underline
             focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
    >
      Descargar folleto
      <app-download-icon />
    </a>
  </div>
</article>

<section class="px-5 py-8 md:px-8 md:py-12 lg:py-24">
  <div class="mx-auto max-w-page">
    <h2 class="text-3xl font-bold md:text-5xl">Descubre nuestros destinos</h2>

    <div class="mt-4 md:flex md:items-center md:justify-between md:gap-8">
      <p class="text-[#343a40]">Más de 100 hoteles frente al mar en veinte países</p>

      <div role="search" class="relative mt-4 md:mt-0 md:w-[300px]">
        <label for="destination-search" class="sr-only">Buscar destino</label>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          class="pointer-events-none absolute top-1/2 left-3 size-5 -translate-y-1/2 text-[#343a40]"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input
          id="destination-search"
          type="search"
          placeholder="Buscar destino"
          class="h-10 w-full rounded-lg bg-surface pr-3 pl-10 focus-visible:outline-2
                 focus-visible:outline-offset-2 focus-visible:outline-brand"
        />
      </div>
    </div>

    <div class="mt-8 grid gap-8 md:mt-12 md:grid-cols-2 lg:grid-cols-3">
      <!-- Las dos últimas solo aparecen en desktop: el diseño muestra cuatro en mobile y
           tablet. Se ocultan por CSS y no recortando el arreglo, para que el HTML que
           renderiza el servidor sea el mismo en todos los anchos. -->
      @for (destination of destinations; track destination.id; let index = $index) {
        <app-destination-card [destination]="destination" [class.max-lg:hidden]="index >= 4" />
      }
    </div>
  </div>
</section>
